name: Database setup

# Run from GitHub → Actions → "Database setup" → Run workflow (works from a phone).
# Applies supabase/migrations to the hosted Supabase project. Needs these
# repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_REF   – the id in the project URL (supabase.com/dashboard/project/<ref>)
#   SUPABASE_DB_PASSWORD   – the database password chosen when creating the project

on:
  workflow_dispatch:
    inputs:
      demo_data:
        description: "Also load demo data (test accounts with password123). Trial projects only!"
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: |
          if [ "${{ inputs.demo_data }}" = "true" ]; then
            supabase db push --password "$SUPABASE_DB_PASSWORD" --include-seed --yes
          else
            supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
          fi
